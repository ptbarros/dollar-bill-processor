name: Build Crop Tool

# Standalone eBay Crop Tool (crop_tool.py) as a self-contained app — the
# cropping feature WITHOUT the full app, for sharing with other collectors.
# Kept entirely separate from the full-app "Build installers" workflow so the
# full program is never published here.
#
# Push a `croptool-v*` tag to build AND publish a GitHub Release containing the
# crop-tool Windows installer, Linux AppImage, and macOS .dmg.
# workflow_dispatch builds the artifacts for testing without creating a release.
on:
  push:
    tags: ['croptool-v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (OpenVINO, torch-free)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # OpenVINO edition: YOLO can use the Intel iGPU, graceful CPU fallback
          # elsewhere. Same onnxruntime import name; collect_all bundles the DLLs.
          pip uninstall -y onnxruntime onnxruntime-gpu onnxruntime-directml || true
          pip install "onnxruntime-openvino>=1.17.0"
          python -c "import onnxruntime as o; assert 'OpenVINOExecutionProvider' in o.get_available_providers()"
          # crop_tool.spec excludes torch/ultralytics; drop the extra Qt binding.
          pip uninstall -y QScintilla PyQt5 PyQt5-Qt5 PyQt5-sip || true
          pip install pyinstaller

      - name: Build onedir crop tool (PyInstaller)
        # Spec copies best.onnx -> detector.bin (obscured; no best.pt shipped).
        run: pyinstaller --noconfirm --clean crop_tool.spec

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\DollarBillCropTool.iss

      - uses: actions/upload-artifact@v4
        with:
          name: crop-tool-windows
          path: dist/DollarBillCropTool-*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (torch-free)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y QScintilla PyQt5 PyQt5-Qt5 PyQt5-sip || true
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y imagemagick libfuse2 || sudo apt-get install -y imagemagick

      - name: Build onedir + AppImage
        run: |
          pyinstaller --noconfirm --clean crop_tool.spec
          APP_NAME=DollarBillCropTool \
          APP_DISPLAY="Dollar Bill Crop Tool" \
          APP_ICON=assets/DD-Crop.png \
          bash tools/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: crop-tool-linux
          path: dist/DollarBillCropTool-x86_64.AppImage
          if-no-files-found: error

  macos:
    runs-on: macos-14           # Apple Silicon (arm64) runner
    continue-on-error: true     # best-effort: a macOS quirk must not block the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (torch-free)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y QScintilla PyQt5 PyQt5-Qt5 PyQt5-sip || true
          pip install pyinstaller

      - name: Build .app + .dmg (unsigned)
        run: |
          pyinstaller --noconfirm --clean crop_tool.spec
          hdiutil create -volname "Dollar Bill Crop Tool" \
            -srcfolder "dist/Dollar Bill Crop Tool.app" \
            -ov -format UDZO dist/DollarBillCropTool-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: crop-tool-macos
          path: dist/DollarBillCropTool-arm64.dmg
          if-no-files-found: error

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/croptool-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Crop Tool release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/crop-tool-windows/*
            artifacts/crop-tool-linux/*
            artifacts/crop-tool-macos/*
          name: "Dollar Bill Crop Tool ${{ github.ref_name }}"
          body: |
            Standalone Crop Tool — crop a folder of bill scans using your Crop
            Manager settings, without the full app.

            **Windows:** download `DollarBillCropTool-*-setup.exe` and run the
            installer (Start-menu shortcut + uninstaller, per-user, no admin
            needed). Windows may show a SmartScreen warning for an unsigned app
            (More info -> Run anyway).

            **Linux:** download `DollarBillCropTool-x86_64.AppImage`, then
            `chmod +x` it and run.

            **macOS (Apple Silicon):** download `DollarBillCropTool-arm64.dmg`,
            open it, and drag the app out. It's unsigned, so first launch needs
            `xattr -dr com.apple.quarantine "/path/to/Dollar Bill Crop Tool.app"`
            (or right-click -> Open) to get past Gatekeeper.
          # Mark as pre-release so the crop tool never becomes the repo's
          # "Latest" release (that's the full app). Flip to false for a final one.
          prerelease: true
